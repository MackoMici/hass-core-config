blueprint:
  name: Otthoni riasztás
  description: Otthoni riasztás ki és be kapcsolás és üzenet küldés telefonra ha esemény
    történik és nincs otthon senki
  domain: automation
  input:
    doorsensor:
      name: Door Sensor
      selector:
        entity:
          domain:
          - binary_sensor
          device_class:
          - door
          multiple: false
    family_wifi:
      name: Family wifi connected
      selector:
        entity:
          domain:
          - group
          multiple: false
    family:
      name: Family Location
      selector:
        entity:
          domain:
          - group
          multiple: false
    security:
      name: Security System
      selector:
        entity:
          domain:
          - alarm_control_panel
          multiple: false
    actions_on:
      name: Notify Actions
      description: Üzenet küldéshez bekapcsoláskor.
      selector:
        action: {}
    actions_off:
      name: Notify Actions
      description: Üzenet küldéshez kikapcsoláskor.
      selector:
        action: {}
    actions_alarm:
      name: Notify Actions
      description: Üzenet küldéshez riasztásnál.
      selector:
        action: {}
  source_url: https://gist.github.com/MackoMici/721dd6ac1e68127fc198cbf8a44d1af9
trigger:
- platform: state
  entity_id: !input family_wifi
  id: Family_wifi
- platform: state
  entity_id: !input doorsensor
  from: 'off'
  to: 'on'
  id: Door
variables:
  family: !input family
  family_wifi: !input family_wifi
action:
- choose:
  - conditions:
    - condition: state
      entity_id: !input family_wifi
      state: not_home
    - condition: trigger
      id:
      - Family_wifi
    sequence:
    - wait_template: '{{ is_state(family_wifi, ''home'') }}'
      timeout: 60
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: !input security
      - choose: []
        default: !input actions_on
  - conditions:
    - condition: state
      entity_id: !input doorsensor
      state: 'on'
    - condition: state
      entity_id: !input family_wifi
      state: not_home
    - condition: trigger
      id:
      - Door
    sequence:
    - wait_template: '{{ is_state(family, ''home'') }}'
      timeout: 60
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - choose: []
        default: !input actions_alarm
      else:
      - service: alarm_control_panel.alarm_disarm
        target:
          entity_id: !input security
      - choose: []
        default: !input actions_off
mode: single
