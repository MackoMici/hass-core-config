streamline_templates: !include lovelace/streamline_templates.yaml
decluttering_templates: !include lovelace/decluttering_templates.yaml

views:
  - panel: true
    badges: []
    cards:
      - type: horizontal-stack
        card_mod:
          style: |
            :host {
              position: relative !important; /* Teljes képernyős rögzítés */
              width: 100% !important;
              height: calc(100vh - var(--header-height, 0px)) !important; /* Levonjuk a felső sáv magasságát, ha van */
              margin: 0 !important;
              padding: 0 !important;
              display: flex !important;
              justify-content: center !important; /* MONITORON EZ HÚZZA KÖZÉPRE AZ EGÉSZET */
              
              /* Alapértelmezett méret (a 16:10-es tableted felbontása) */
              --base-w: 100vw;
            }
            
            /* HA A MONITOR SZÉLESEBB MINT A TABLET (16:10 felett, pl. 16:9-es monitor) */
            @media (min-aspect-ratio: 16/10) {
              :host {
                /* Monitoron a sávok miatti valós magassághoz igazítjuk a virtuális szélességet */
                --base-w: calc((100vh - var(--header-height, 0px)) * 1.6);
              }
              /* A horizontal-stack belső konténerét is rákényszerítjük a fix szélességre */
              #root {
                width: var(--base-w) !important;
                max-width: var(--base-w) !important;
                height: 100% !important;
                display: flex !important;
              }
            }
        cards:
          # --- 1. ELEM: A SIDEBAR (A horizontal-stack bal oldala) ---
          - !include lovelace/sidebar-new.yaml
          - !include lovelace/popup-new.yaml
          # --- 2. ELEM: PERSON CARDOK (Sima mod-card, ami egy darab horizontal-stack-et tartalmaz) ---
          - type: custom:mod-card
            card_mod:
              style: |
                :host {
                  /* FIXED helyett ABSOLUTE, és a top-ot a relative szülőhöz mérjük, így a felső sáv nem tolja rá a floorplanre */
                  position: absolute !important;
                  top: 10px !important; 
                  margin: 0px !important;
                  padding: 0px !important;
                  z-index: 4 !important;
                  
                  width: calc(var(--base-w) * 0.21) !important;
                  /* Nem a 50vw-ből (képernyő közép), hanem a konténer közepéből számolunk (50%), így a bal oldali HA sáv sem húzza el */
                  left: calc(50% - (var(--base-w) / 2) + (var(--base-w) * 0.53)) !important;
                }
            card:
              type: horizontal-stack
              cards:
                - type: custom:streamline-card
                  template: tablet_person_template
                  variables:
                    - entity: person.hunyadvari_zoltan
                    - navigation_path: "#zoli"
                - type: custom:streamline-card
                  template: tablet_person_template
                  variables:
                    - entity: person.szakacs_katalin
                    - navigation_path: "#kata"
          # --- 3. ELEM: BUBBLE GOMBOK (Sima mod-card, ami egy darab vertical-stack-et tartalmaz) ---
          - type: custom:mod-card
            card_mod:
              style: |
                :host {
                  position: absolute !important; /* FIXED HELYETT ABSOLUTE */
                  margin: 0px !important;
                  padding: 0px !important;
                  z-index: 4 !important;
                  
                  width: calc(var(--base-w) * 0.06) !important; 
                  left: calc(50% - (var(--base-w) / 2) + (var(--base-w) * 0.34)) !important; /* 50vw helyett 50% */
                  
                  top: calc(var(--base-w) * 0.29) !important;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:information
                  layout: vertical
                  styles: &style |
                    .bubble-button-card-container {
                      background: none;
                    }
                  tap_action:
                    action: navigate
                    navigation_path: "#system"
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:battery-alert
                  layout: vertical
                  styles: |
                    .bubble-button-card-container {
                      background: none;
                    }
                    .bubble-icon-container {
                      background-color: ${hass.states['binary_sensor.elemek'].state === 'on' ? 'var(--warning-color)' : 'var(--success-color)'} !important;
                    }
                  tap_action:
                    action: navigate
                    navigation_path: "#batterys"
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:alert
                  layout: vertical
                  styles: |
                    .bubble-button-card-container {
                      background: none;
                    }
                    .bubble-icon-container {
                      background-color: ${hass.states['sensor.alert2_on_unacked_count'].state > 0 ? 'var(--warning-color)' : 'var(--success-color)'} !important;
                    }
                  tap_action:
                    action: navigate
                    navigation_path: "#alert2"
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:leaf
                  layout: vertical
                  tap_action:
                    action: navigate
                    navigation_path: "#leaf"
                  styles: |
                    .bubble-button-card-container {
                      background: none;
                    }
                    .bubble-icon-container {
                      background-color: ${hass.states['sensor.noveny_problema'].state > 0 ? 'var(--warning-color)' : 'var(--success-color)'} !important;
                    }
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:robot-vacuum
                  layout: vertical
                  styles: *style
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  sub_button:
                    main: []
                    bottom: []
                  scrolling_effect: false
                  show_name: false
                  icon: mdi:pine-tree
                  layout: vertical
                  styles: *style
          # --- FLOORPLAN CARD ---
          - type: custom:floorplan-card
            full_height: true
            card_mod:
              style: |
                :host {
                  position: absolute !important;
                  top: 0;
                  margin: 0px !important;
                  padding: 0px !important;
                  height: 100%;
                  width: calc(var(--base-w) * 0.67) !important;
                  left: calc(50% - (var(--base-w) / 2) + (var(--base-w) * 0.33)) !important; /* 50vw helyett 50% */
                }
                ha-card {
                  background: transparent;
                  box-shadow: none;
                }
            config:
              image: /local/floorplan/House_2023_optimized.svg
              stylesheet: /local/floorplan/House_2023.css
              defaults:
                tap_action: none
              rules:
              - name: Hőmérséklet
                entities:
                  - sensor.haloszoba_temperature
                  - sensor.konyha_temperature
                  - sensor.nappali_temperature
                  - sensor.ebedlo_temperature
                  - sensor.gyerekszoba_temperature
                  - sensor.furdoszoba_homerseklet
                state_action:
                  - service: floorplan.text_set
                    service_data: '${(entity.state !== undefined) ? Math.round(entity.state* 10) / 10 + "°C" : "unknown"}'
              - name: Páratartalom
                entities:
                  - sensor.haloszoba_humidity
                  - sensor.konyha_humidity
                  - sensor.nappali_humidity
                  - sensor.ebedlo_humidity
                  - sensor.gyerekszoba_humidity
                  - sensor.furdoszoba_paratartalom
                state_action:
                  - service: floorplan.text_set
                    service_data: '${(entity.state !== undefined) ? Math.round(entity.state * 10) / 10 + "%" : "unknown"}'
              - name: Entitások
                entities:
                  - switch.sonoff_furdo_szelloztetes
                  - switch.sonoff_illatosito
                  - switch.sonoff_furdoszoba_futes
                  - media_player.samsung_q80_series_65
                  - fan.aroma_diffuser
                  - climate.gree_klima
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: entities entity-state-${entity.state}
              - name: Ajtók
                entities:
                  - binary_sensor.sonoff_bejarati_ajto
                  - binary_sensor.kamra_contact
                  - binary_sensor.wc_contact
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: motion door-${entity.state}
              - name: Ablakok
                entities:
                  - binary_sensor.haloszoba_ablak_contact
                  - binary_sensor.nappali_ablak_contact
                  - binary_sensor.gyerekszoba_ablak_contact
                  - binary_sensor.konyha_ablak_contact
                  - binary_sensor.furdoszoba_ablak_contact
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: motion window-${entity.state}
              - name: Fények 1
                entities:
                  - light.eloszoba_main
                  - light.furdo_main
                  - light.kamra_main
                  - light.kazan_main
                  - light.wc_main
                  - light.halo_main
                  - light.ebedlo_main
                  - light.szoba_main
                  - light.nappali_asztali_lampa
                  - light.aroma_diffuser_nightlight
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: light-${entity.state}
              - name: Fények 2
                entities:
                  - light.eloszoba_main
                  - light.furdo_main
                  - light.kamra_main
                  - light.kazan_main
                  - light.wc_main
                  - light.halo_main
                  - light.ebedlo_main
                  - light.szoba_main
                  - light.nappali_asztali_lampa
                  - light.aroma_diffuser_nightlight
                double_tap_action:
                  action: toggle
                state_action:
                  action: call-service
                  service: floorplan.style_set
                  service_data:
                    element: ${entity.entity_id.replace('light.', 'light_overlay.')}
                    style: |
                      >
                      if( entity.state !== "on" )
                          return "display: none;";
                      let hue = 0;
                      let sat = 0;
                      if( entity.attributes.hs_color ) {
                          hue = entity.attributes.hs_color[0];
                          sat = entity.attributes.hs_color[1];
                      }
                      if( sat < 10 ) {
                          return `
                            display: block;
                            filter:
                              brightness(calc( ${entity.attributes.brightness} / 255));`
                      }
                      return `
                        display: block;
                        filter:
                          sepia(100%)
                          hue-rotate(calc( ${hue}deg - 55deg ))
                          saturate(calc( ${sat}% * 2 ))
                          brightness(calc( ${entity.attributes.brightness} / 255));`
              - name: Fények 3
                entities: 
                  - light.kamra_main
                  - light.wc_main
                  - light.nappali_asztali_lampa
                hold_action:
                  action: navigate
                  navigation_path: "#${entity.entity_id}"
              - name: Párásító
                entity: fan.aroma_diffuser
                tap_action:
                  action: navigate
                  navigation_path: "#parasitas"
              - name: Törölköző szárító
                entity: switch.sonoff_furdoszoba_futes
                tap_action: toggle
                hold_action:
                  action: navigate
                  navigation_path: "#timer"
              - name: Szellőztetés
                entity: switch.sonoff_furdo_szelloztetes
                tap_action: toggle
              - name: Tv
                entity: media_player.samsung_q80_series_65
                tap_action:
                  action: navigate
                  navigation_path: "#tv"
              - name: Illatosító
                entity: switch.sonoff_illatosito
                tap_action:
                  action: navigate
                  navigation_path: "#illatosito"
              - name: Klíma
                entity: climate.gree_klima
                tap_action:
                  action: navigate
                  navigation_path: "#klima"
              - name: Tablet
                entities:
                  - switch.hipad_xpro_kepernyo
                  - binary_sensor.hipad_xpro_csatlakoztatva
                element: switch.hipad_xpro_kepernyo
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: |
                    >
                    let classes = [];
                    if (entities['binary_sensor.hipad_xpro_csatlakoztatva'].state === 'on')
                      classes.push('charging charge-state-on');
                    else
                      classes.push('charging charge-state-off')
                    if (entities['switch.hipad_xpro_kepernyo'].state === 'on')
                      classes.push('entities entity-state-on');
                    else
                      classes.push('entities entity-state-off');
                    return classes.join(' ');
                tap_action:
                  action: navigate
                  navigation_path: "#tablet"
              - name: Fűtés
                entity: climate.honeywell_home_termosztat
                tap_action:
                  action: navigate
                  navigation_path: "#futes"
                state_action:
                  action: call-service
                  service: floorplan.class_set
                  service_data: entities entity-state-${entity.attributes.hvac_action}