
# Loads default set of integrations. Do not remove.
default_config:

#logger:
#  default: info
#  logs:
#    homeassistant.components.pi_hole: debug

http:
  ssl_certificate: !secret ssl_cert
  ssl_key: !secret ssl_key
  ip_ban_enabled: true
  login_attempts_threshold: 5
  use_x_forwarded_for: false
  trusted_proxies: 
    - !secret trusted_proxy_ip

lovelace:
  resource_mode: yaml
  resources:
    - url: /hacsfiles/ha-floorplan/floorplan.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/vacuum-card/vacuum-card.js
      type: module
    - url: /hacsfiles/weather-radar-card/weather-radar-card.js
      type: module
    - url: /hacsfiles/hass-swipe-navigation/swipe-navigation.js
      type: module
    - url: /hacsfiles/lovelace-auto-entities/auto-entities.js
      type: module
    - url: /hacsfiles/Bubble-Card/bubble-card.js
      type: module
    - url: /hacsfiles/streamline-card/streamline-card.js
      type: module
    - url: /hacsfiles/decluttering-card/decluttering-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/pi-hole-card/pi-hole-card.js
      type: module
    - url: /hacsfiles/ha-weather-forecast-card/weather-forecast-card.js
      type: module
    - url: /hacsfiles/Statistics-Graph-Chart-Card/statistics-graph-chart-card.js
      type: module
    - url: /hacsfiles/hass-alert2-ui/alert2.js
      type: module
    - url: https://fonts.googleapis.com/css2?family=Oxygen&family=Ubuntu:wght@300&display=swap
      type: css
  dashboards:
    lovelace-mobil-new:
      mode: yaml
      filename: mobil-new.yaml
      title: Mobil
      icon: mdi:cellphone
      show_in_sidebar: true
    lovelace-floorplan:
      mode: yaml
      filename: floorplan.yaml
      title: Floorplan
      icon: mdi:floor-plan
      show_in_sidebar: true

homeassistant:
  packages: !include_dir_named include
  customize: !include customize.yaml
  allowlist_external_dirs:
    - "/config" # Default configuration directory

isal:

sonoff:
  username: !secret sonoff_username
  password: !secret sonoff_password

visionect_joan:
  main_menu_url: !secret joan_main_menu_url

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
alert2: !include alerts.yaml

shell_command:
  git_auto_backup: '/bin/bash /config/git-auto-backup.sh'