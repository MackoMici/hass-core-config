command_line:
  - sensor:
      name: SSL cert expiry
      unit_of_measurement: d
      scan_interval: 10800
      device_class: duration
      command: "ssl-cert-check -b -c /etc/letsencrypt/live/hgc09ssbwn6.sn.mynetname.net/cert.pem | awk '{ print $NF }'"

  - binary_sensor:
      name: ESPhome
      command: 'systemctl is-active esphome@homeassistant.service > /dev/null 2>&1 && echo active || echo inactive'
      payload_on: "active"
      payload_off: "inactive"
      device_class: running
      icon: >
        {% if value == 'active' %}
          mdi:play
        {% else %}
          mdi:stop
        {% endif %}

  - binary_sensor:
      name: FlexGet
