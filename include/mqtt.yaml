mqtt:
  binary_sensor:
    - name: Tablet MQTT Connected
      unique_id: tab_mqtt_connected
      payload_on: true
      payload_off: false
      expire_after: 1800
      state_topic: tablet/deviceInfo
      device_class: connectivity
      icon: mdi:check-network
      value_template: '{{ value_json.mqttConnected }}'
    - name: Tablet On Motion
      state_topic: tablet/event/onMotion
      unique_id: tab_on_motion
      icon: mdi:motion-sensor
      device_class: motion
      off_delay: 10
      value_template: "{% if value_json.event == 'onMotion' %}on{% else %}off{% endif %}"
      payload_on: "on"
      payload_off: "off"

  sensor:
    - name: Tablet Last App Start
      unique_id: tab_last_app_start
      state_topic: tablet/deviceInfo
      device_class: timestamp
      icon: mdi:restart
      value_template: '{{ value_json.appStartTime }}'
    - name: Tablet Wi-fi Connection
      unique_id: tab_wi-fi_connection
      state_topic: tablet/deviceInfo
      icon: mdi:wifi
      value_template: '{{ value_json.SSID }}'
    - name: Tablet Battery Temperature
      unique_id: tab_battery_temperature
      state_topic: tablet/deviceInfo
      device_class: temperature
      icon: mdi:thermometer
      unit_of_measurement: '°C'
      value_template: '{{ value_json.batteryTemperature }}'
    - name: Tablet App Used Memory
      unique_id: tab_app_used_memory
      state_topic: tablet/deviceInfo
      unit_of_measurement: '%'
      icon: mdi:application
      value_template: '{{ 100 - (value_json.appFreeMemory / value_json.appTotalMemory * 100) | int(default=0) }}'
    - name: Tablet Used Memory
      unique_id: tab_used_memory
      state_topic: tablet/deviceInfo
      unit_of_measurement: '%'
      icon: mdi:memory
      value_template: '{{ 100 - (value_json.ramFreeMemory / value_json.ramTotalMemory * 100) | int(default=0) }}'