template:
  - binary_sensor:
      - name: Fűtés ablak
        device_class: window
        state: >-
          {% set open = expand(states.binary_sensor.ablakok)
            | rejectattr('entity_id', 'search', 'halo')
            | rejectattr('entity_id', 'search', 'furdo')
            | selectattr('state', 'eq', 'on')
            | list
            | count %}
          {{ 'on' if open > 0 else 'off' }}

  - sensor:
      - name: "Mikrotik Router Uptime"
        unique_id: router_uptime
        icon: mdi:history
        state: >
          {% set mins = (as_timestamp(now()) - as_timestamp(states('sensor.hap_ax_3_router_core_uptime'))) | int // 60 %}
          {% set hours = mins // 60 %}
          {% set days = mins // 1440 %}
          {% if days > 1 %}
            {{ days }} napja
          {% elif hours > 1 %}
            {{ hours }} órája
          {% else %}
            {{ mins }} perce
          {% endif %}

      - name: "Home Assistant Server Uptime"
        unique_id: ha_server_uptime
