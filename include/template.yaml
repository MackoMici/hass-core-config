      - name: "HiPad XPro Tablet Uptime"
        icon: mdi:history
        availability: >
          {{ states('sensor.hipad_xpro_last_reboot') not in ['unavailable', 'unknown'] }}
        state: >
          {% set mins = (as_timestamp(now()) - as_timestamp(states('sensor.hipad_xpro_last_reboot'))) | int // 60 %}
          {% set hours = mins // 60 %}
          {% set days = mins // 1440 %}
          {% if days > 1 %}
