multiscrape:
  - resource: https://www.idokep.hu/elorejelzes/Szekszárd
    scan_interval: 3600
    timeout: 60
    sensor:
      - unique_id: idokep_elorejelzes
        name: Weather
        select: "div.row.bigForecastCard > div > h4"
        attributes:
          - name: Details
            select: "div.row.bigForecastCard > div > p"
            extract: content
          - name: Forecast Details
            select: "div.leftColumn > div > div:nth-child(1) > div > div > div > p"
            extract: content
          - name: Forecast Details 2
            select: "div.leftColumn > div > div:nth-child(2) > div > div > div > p"
            extract: content
          - name: Forecast Details 3
            select: "div.leftColumn > div > div:nth-child(3) > div > div > div > p"
            extract: content