uzenet_kuldes_zolinak:
  sequence:
  - data:
      message: '{{message}}'
      title: '{{title}}'
    action: notify.mobile_app_sm_a536b
  icon: mdi:cellphone-message
  mode: single
  fields:
    title:
      selector:
        text:
      name: Title
      description: Az üzenet címe
      required: true
    message:
      selector:
        text:
      name: Message
      description: Az üzenet szövege
      required: true
  alias: Üzenet küldés Zolinak
  description: ''
idojaras:
  sequence:
  - action: visionect_joan.send_weather
    data:
      layout: detailed_summary
      device_id: f4de3d4bb183675616e06d6080ad0155
      weather_entity: weather.forecast_otthon
  alias: Időjárás
  description: ''
input_datetime_allitas:
  alias: Input datetime állítás
  mode: single
  fields:
    entity:
      description: Input_datetime entity_id
      example: input_datetime.pelda_ido
    step:
      description: Lépés percben (pozitív vagy negatív)
      example: 15
    min_time:
      description: Minimális idő (HH:MM:SS)
      example: 06:00:00
    max_time:
      description: Maximális idő (HH:MM:SS)
      example: '22:00:00'
  sequence:
  - variables:
      step_sec: '{{ (step | int) * 60 }}'
      current_ts: '{{ today_at(states(entity)) | as_timestamp }}

        '
      new_ts: '{{ current_ts + step_sec }}'
      min_ts: '{{ today_at(min_time) | as_timestamp }}'
      max_ts: '{{ today_at(max_time) | as_timestamp }}'
      final_ts: "{% if new_ts < min_ts %}\n  {{ min_ts }}\n{% elif new_ts > max_ts
        %}\n  {{ max_ts }}\n{% else %}\n  {{ new_ts }}\n{% endif %}\n"
  - target:
      entity_id: '{{ entity }}'
    data:
      time: '{{ final_ts | timestamp_custom(''%H:%M:%S'', true) }}'
    action: input_datetime.set_datetime
  description: ''
