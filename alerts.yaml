      {{ states(genEntityId) | int(0) > 75 }}

    delay_on_secs: 300

    icon: mdi:harddisk

    title: "Riasztás:"
    message: "kevés a szabad hely - {{ states(genEntityId) }}%"
    done_message: "már van elég szabad hely - {{ states(genEntityId) }}%"