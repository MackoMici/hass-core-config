    title: "Riasztás:"
    message: "magas terhelést ért el - {{ states('sensor.system_monitor_processzor_hasznalat') }}%"
    done_message: "visszaállt a normális szintre - {{ states('sensor.system_monitor_processzor_hasznalat') }}%"

  - domain: lxc_memoria
    friendly_name: "{{ genGroups[0] | replace('_', ' ') | title }} Memory Használat"

    priority: "high"

    generator: "{{ states.sensor|entity_regex('sensor.lxc_(.*)_memory_used_percentage')|list }}"

    name: "{{ genGroups[0] }}_memory_usage"
    
    condition: >-
      {{ states(genEntityId) | int(0) > 20 }}

    delay_on_secs: 300

    icon: mdi:memory

    title: "Riasztás:"
    message: "magas - {{ states(genEntityId) }}%"
    done_message: "visszaállt a normális szintre - {{ states(genEntityId) }}%"

  - domain: proxmox_memoria
    name: proxmox_memory
    friendly_name: "Proxmox Memory Használat"
    
    priority: "medium"

    trigger_on:
      - trigger: numeric_state
        entity_id: sensor.node_pve_memory_used_percentage
        above: 70
