        below: 70

    icon: mdi:memory

    title: "Riasztás:"
    message: "magas - {{ states('sensor.node_pve_memory_used_percentage') }}%"
    done_message: "visszaállt a normális szintre - {{ states('sensor.node_pve_memory_used_percentage') }}%"

  - domain: addon_memoria
    friendly_name: "{{ genGroups[0] | replace('_', ' ') | title }} Memory Használat"

    priority: "high"

    generator: "{{ states.sensor|entity_regex('sensor.(.*)_memoria_szazalek')|list }}"

    name: "{{ genGroups[0] }}_memory_usage"
    
    condition: >-
