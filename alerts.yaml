    title: "Riasztás:"
    message: "magas terhelést ért el - {{ states('sensor.node_pve_cpu_used') }}%"
    done_message: "visszaállt a normális szintre - {{ states('sensor.node_pve_cpu_used') }}%"

  - domain: haos_cpu
    name: "sensor.system_monitor_processzor_hasznalat_{{ cpu_load }}"
    friendly_name: "HAOS CPU Használat {{ cpu_load }}%"
    
    priority: "{{ pri }}"

    supersedes: "{{ genPrevDomainName }}"

    generator:
      - { cpu_load: 10, pri: low }
