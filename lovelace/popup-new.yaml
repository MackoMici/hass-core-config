type: vertical-stack
cards:
  - hash: '#alarm'
    type: custom:bubble-card
    popup_style: classic
    card_type: pop-up
    button_type: name
    show_header: true
    name: Riasztó
    show_icon: false
    popup_mode: centered
    full_width_on_mobile: true
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        <<: &none
          tap_action:
            action: none
          hold_action:
            action: none
          button_action:
            tap_action:
              action: none
            hold_action:
              action: none
        entity: alarm_control_panel.gateway_alarm
        sub_button:
          main:
            - entity: alarm_control_panel.gateway_alarm
              tap_action:
                action: perform-action
                perform_action: alarm_control_panel.alarm_arm_away
                target:
                  entity_id: alarm_control_panel.gateway_alarm
                data: {}
              icon: mdi:shield-lock
            - entity: alarm_control_panel.gateway_alarm
              tap_action:
                action: perform-action
                perform_action: alarm_control_panel.alarm_disarm
                target:
                  entity_id: alarm_control_panel.gateway_alarm
                data: {}
              icon: mdi:shield-off
        styles: |
          .bubble-button-card-container {
            background-color: ${state === 'disarmed' ? 'var(--success-color)' : state === 'triggered' || state ==='pending' ? 'var(--error-color)' : 'var(--warning-color)'};
          }
          .bubble-icon {
            color: ${state === 'disarmed' ? 'var(--success-color)' : state === 'triggered' || state ==='pending' ? 'var(--error-color)' : 'var(--warning-color)'} !important;
            opacity: 0.6 !important;
          }
  - hash: '#batterys'
    type: custom:bubble-card
    card_type: pop-up
    button_type: name
    show_header: true
    sub_button:
    name: Merülő elemek
    show_icon: false
    popup_mode: centered
    full_width_on_mobile: true
    cards:
      - type: custom:auto-entities
        card:
          square: false
          type: grid
          columns: 1
        card_param: cards
        filter:
          template: >-
            {%- for state in states.sensor if "battery_plus" in state.entity_id and 
              (state.attributes.battery_low == true or state.state == "unknown") -%}
              {{
                {
                  "entity": state.entity_id,
                  "name": state.attributes.friendly_name.rsplit(' ', 1)[0],
                  "type": "custom:bubble-card",
                  "card_type": "button",
                  "card_layout": "large",
                  "rows": "1.5",
                  "button_type": "slider",
                  "tap_action": {
                    "action": "none",
                  },
                  "button_action": {
                    "tap_action": {
                      "action": "none",
                    },
                  },
                  "show_last_changed": true,
                  "show_state": true,
                  "read_only_slider": true,
                  "scrolling_effect": false,
                  "styles": ".bubble-range-fill {  \n  background-color: var(${state > 50.0 ?  '--success-color' : state > 20.0 ? '--warning-color' : '--error-color'}) !important;\n}\n${(() => {\n  let date = new Date(hass.states[entity].attributes['battery_last_replaced']);\n  let options = {\n    weekday: \"short\",\n    year: \"numeric\",\n    month: \"short\",\n    day: \"numeric\",  \n  }\n  card.querySelector('.bubble-state').innerText = hass.states[entity].state + '% - ' + (hass.states[entity].attributes['battery_last_replaced'] == null ?\n  \"never\" : date.toLocaleDateString(undefined, options));\n  })()\n} \n .slider-container {  \n  cursor: default !important;\n}",
                  "sub_button": [
                      {
                          "show_state": false,
                          "show_icon": false,
                          "state_background": false,
                          "show_background": false,
                          "show_attribute": true,
                          "tap_action": {
                              "action": "none",
                          },
                          "attribute": "battery_type_and_quantity"
                      },
                      {
                          "show_name": true,
                          "show_state": false,
                          "show_icon": false,
                          "state_background": true,
                          "show_background": true,
                          "tap_action": {
                              "action": "perform-action",
                              "perform_action": "button.press",
                              "target": {
                                "entity_id": state.entity_id | replace('sensor.', 'button.') | replace('_plus', '_replaced')
                                }  
                          },
                          "name": states[state.entity_id | replace('sensor.', 'button.') | replace('_plus', '_replaced')].attributes.friendly_name.rsplit(' ', 2)[-2] ~ ' ' ~ states[state.entity_id | replace('sensor.', 'button.') | replace('_plus', '_replaced')].attributes.friendly_name.rsplit(' ', 2)[-1]
                      }
                  ],
                  "modules": [
                      "home-assistant-default"
                  ]
                }
              }},
            {%- endfor -%}
        sort:
          method: state
          numeric: true
          reverse: false
          ip: false
          ignore_case: false
        show_empty: true
        visibility:
          - condition: state
            state_not: ''
  - hash: '#windows'
    type: custom:bubble-card
    card_type: pop-up
    button_type: name
    show_header: true
    name: Nyitott Ablakok
    show_icon: false
    popup_mode: centered
    full_width_on_mobile: true
    cards:
      - type: custom:auto-entities
        card:
          square: false
          type: grid
          columns: 1
        card_param: cards
        filter:
          include:
            - options:
                type: custom:bubble-card
                card_type: button
                button_type: state
                show_last_changed: true
                show_state: true
                read_only_slider: true
                scrolling_effect: false
                <<: *none
              attributes:
                device_class: window
              state: 'on'
          exclude:
            - options: {}
              entity_id: binary_sensor.ablakok
            - options: {}
              entity_id: binary_sensor.futes_ablak
        sort:
          method: state
          numeric: true
          reverse: false
          ip: false
          ignore_case: false
        show_empty: true
        visibility:
          - condition: state
            state_not: ''
  - hash: '#weather'
    type: custom:bubble-card
    popup_mode: centered
    width_desktop: 100%
    full_width_on_mobile: true
    card_type: pop-up
    button_type: name
    show_header: true
    show_icon: false
    name: Időjárás jelentés
    cards:
      - type: custom:weather-forecast-card
        default_forecast: daily
        tap_action:
          action: none
        entity: weather.forecast_otthon
        show_condition_effects:
          - rain
          - sun
          - moon
          - sky
        forecast:
          mode: chart
          default_chart_attribute: temperature_and_precipitation
          extra_attribute: wind_bearing
          hourly_group_size: 1
        forecast_action:
          tap_action:
            action: toggle-forecast
          hold_action:
            action: select-forecast-attribute
  - hash: '#weather_map'
    type: custom:bubble-card
