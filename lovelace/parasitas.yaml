type: vertical-stack
cards:
  - type: custom:stack-in-card
    card_mod: &background_none
      style: |
        ha-card {
          background: none;
          border: none;
          box_shadow: none;
        }
    cards:
      - type: custom:mushroom-fan-card
        entity: fan.aroma_diffuser_aroma_diffuzor
        card_mod: *background_none
        show_percentage_control: true
        <<: &none2
          hold_action: none
          double_tap_action: none
        collapsible_controls: true
        secondary_info: none
      - type: custom:decluttering-card
        template: mushroom_chips_template
        variables:
          - chips:
              - type: conditional
                conditions:
                  - entity: select.aroma_diffuser_idozito
                    state_not: 'Off'
                  - entity: fan.aroma_diffuser_aroma_diffuzor
                    state: 'on'
                chip:
                  type: template
                  tap_action: none
                  hold_action: none
                  double_tap_action: none
                  entity: select.aroma_diffuser_idozito
                  content: |
                    {% if not is_state_attr(entity, 'remaining', 0) %}
                      {{ state_attr(entity, 'remaining') }} perc a leállásig
                    {% endif %}
  - type: conditional
    conditions:
      - entity: fan.aroma_diffuser_aroma_diffuzor
        state_not: 'off'
    card:
      type: custom:stack-in-card
      card_mod: *background_none
      cards:
        - type: custom:decluttering-card
          template: mushroom_light_template
          variables:
            - entity: light.aroma_diffuser_ejjeli_lampa
        - type: custom:decluttering-card
          template: mushroom_chips_template
          variables:
            - chips:
                - type: conditional
                  conditions:
                    - entity: light.aroma_diffuser_ejjeli_lampa
                      state: 'on'
                  chip:
                    type: action
                    icon: mdi:creation
                    tap_action:
                      action: call-service
                      service: light.turn_on
                      data:
                        effect: Colorful
                      target:
                        entity_id: light.aroma_diffuser_ejjeli_lampa
                    hold_action: none
                    double_tap_action: none
  - type: conditional
    conditions:
      - entity: fan.aroma_diffuser_aroma_diffuzor
        state_not: 'off'
    card:
      type: horizontal-stack
      cards:
        - type: custom:decluttering-card
          template: mushroom_humidity_timer_template
          variables:
            - icon: mdi:numeric-1
            - countdown: "1 hour"
        - type: custom:decluttering-card
          template: mushroom_humidity_timer_template
          variables:
            - icon: mdi:numeric-3
            - countdown: "3 hours"
        - type: custom:decluttering-card
          template: mushroom_humidity_timer_template
          variables:
            - icon: mdi:numeric-6
            - countdown: "6 hours"
        - type: custom:decluttering-card
          template: mushroom_humidity_timer_template
          variables:
            - icon: mdi:timer-off
            - countdown: "Off"
  - type: custom:apexcharts-card
    card_mod: *background_none
    config_templates:
      - default_chart
      - day_chart
    series:
      - entity: sensor.belteri_paratartalom
        name: Beltéri
      - entity: sensor.kulteri_paratartalom
        name: Kültéri
        type: area
        opacity: 0.2
      - entity: sensor.furdoszoba_paratartalom
        name: Fürdő
  - type: grid
    square: false
    columns: 3
    cards:
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.ebedlo_humidity
          - name: Ebédlő
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.nappali_humidity
          - name: Nappali
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.haloszoba_humidity
          - name: Háló
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.konyha_humidity
          - name: Konyha
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.gyerekszoba_humidity
          - name: Gyerekszoba
      - type: custom:decluttering-card
        template: mushroom_entity_futes_template
        variables:
          - entity: sensor.furdoszoba_paratartalom
          - name: Fürdő
