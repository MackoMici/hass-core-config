minigraph_template:
  default:
    - min: 10
    - max: 30
  card:
    type: custom:mini-graph-card
    entities:
      - entity: '[[entity]]'
    color_thresholds:
      - value: '[[min]]'
        color: "#CCE5FF"
      - "#66B2FF"
      - "#0080FF"
      - "#87c087"
      - "#389638"
      - "#FF9932"
      - "#FF8000"
      - value: '[[max]]'
        color: "#ff0000"
    hours_to_show: 24
    points_per_hour: 1.2
    animate: false
    aggregate_func: avg
    line_width: 1
    height: 52
    tap_action:
      action: none
    group: true
    show:
      labels: false
      fill: true
      state: false
      name: false
      icon: false
    card_mod:
      style: |
        ha-card {
          height: 84px; # Ensure this height is appropriate for the graph display
          position: absolute;
          box-shadow: none;
          background: none;
          border-radius: 40px; # Note: border-color black is set but border-width is 0
          border-color: black;
          border-width: 0px; # Explicitly setting border-width to 0 for clarity
          opacity: 1;
          /* >>> Adjust this value to fine-tune the vertical alignment <<< */
          margin-bottom: -58px;
          /* >>> Experiment with -55px, -60px, etc. until alignment is right <<< */
          margin-left: 0em;
          margin-right: 0em;
          width: 100%; /* Ensure it takes full width within its container */
          left: 0; /* Position from the left edge */
          top: 0; /* Position from the top edge within the stack */
        }