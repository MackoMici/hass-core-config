          - entity_mem: sensor.home_assistant_supervisor_memory_percent
          - entity_on: input_boolean.cpu_es_memoria
          - tap_action:
              action: navigate
              navigation_path: "#haos_stat"
      - type: custom:streamline-card
        template: addon_template
        variables:
          - entity_update: update.home_assistant_operating_system_update
      - type: custom:streamline-card
        template: update_template
        variables:
