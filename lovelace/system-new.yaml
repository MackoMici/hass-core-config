type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: sub-buttons
    hide_main_background: true
    sub_button:
      main: []
      bottom:
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:home-assistant
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Home Assistant Server
            service: input_select.select_option
          show_background: true
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:puzzle
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Home Assistant Add-on
            service: input_select.select_option
          show_background: true
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:debian
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Debian Server
            service: input_select.select_option
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:plex
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Plex Server
            service: input_select.select_option
          show_background: true
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:swap-vertical
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: qBittorrent Server
            service: input_select.select_option
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:pi-hole
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Pi-Hole Server
            service: input_select.select_option
          show_background: true
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:server-network
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Proxmox Server
            service: input_select.select_option
        - entity: input_select.menu
          state_background: true
          sub_button_type: default
          icon: mdi:router-network-wireless
          tap_action:
            action: call-service
            target:
              entity_id: entity
            data:
              option: Mikrotik Router
            service: input_select.select_option
    styles: |
      .bubble-sub-button-1 {
        background-color: ${ hass.states['input_select.menu'].state === 'Home Assistant Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-2 {
        background-color: ${ hass.states['input_select.menu'].state === 'Home Assistant Add-on' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-3 {
        background-color: ${ hass.states['input_select.menu'].state === 'Debian Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-4 {
        background-color: ${ hass.states['input_select.menu'].state === 'Plex Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-5 {
        background-color: ${ hass.states['input_select.menu'].state === 'qBittorrent Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-6 {
        background-color: ${ hass.states['input_select.menu'].state === 'Pi-Hole Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-7 {
        background-color: ${ hass.states['input_select.menu'].state === 'Proxmox Server' ? "var(--bubble-default-color)" : "" } !important;
      }
      .bubble-sub-button-8 {
        background-color: ${ hass.states['input_select.menu'].state === 'Mikrotik Router' ? "var(--bubble-default-color)" : "" } !important;
      }
    rows: 0.938
  - type: vertical-stack
    visibility:
      - condition: state
        entity: input_select.menu
        state: "Home Assistant Server"
    cards:
      - type: custom:streamline-card
        template: separator_uptime_template
        variables:
          - entity: sensor.home_assistant_server_uptime
      - type: custom:streamline-card
        template: bubble_state_template
        variables:
          - entity: sensor.hgc09ssbwn6_sn_mynetname_net_tanusitvany_lejarata
      - type: custom:streamline-card
        template: sensor_template
        variables:
          - entity_1: sensor.system_monitor_processzor_hasznalat
          - entity_2: sensor.system_monitor_memoriahasznalat
          - entity_3: sensor.system_monitor_disk_used_percentage
          - tap_action:
              action: navigate
              navigation_path: "#haos_stat"
      - type: custom:streamline-card
        template: bubble_state_template
