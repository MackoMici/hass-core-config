- type: custom:decluttering-card
  template: mushroom_switch_light_template
  variables:
    - entity: switch.smartplug_konnektor
    - layout: horizontal
- type: custom:decluttering-card
  template: mushroom_switch_light_template
  variables:
    - entity: switch.energy_monitoring_smartplug_none
    - layout: horizontal
- type: custom:decluttering-card
  template: mushroom_switch_light_template
  variables:
    - entity: switch.energy_monitoring_smartplug_none_2
    - layout: horizontal
- type: custom:stack-in-card
  card_mod:
    style: |
      ha-card {
        background: none;
        border: none;
        box-shadow: none;
      }
  cards:
    - type: custom:decluttering-card
      template: mushroom_light_template
      variables:
        - entity: light.led_strip
    - type: custom:decluttering-card
      template: mushroom_chips_template
      variables:
        - chips:
            - type: conditional
              conditions:
                - entity: light.led_strip
                  state: 'on'
              chip:
                type: action
                icon: mdi:music
                tap_action:
                  action: call-service
                  service: light.turn_on
                  data:
                    effect: Music
                  target:
                    entity_id: light.led_strip
                hold_action: none
                double_tap_action: none
            - type: conditional
              conditions:
                - entity: light.led_strip
                  state: 'on'
              chip:
                type: action
                icon: mdi:creation
                tap_action:
                  action: call-service
                  service: light.turn_on
                  data:
                    effect: Dynamic
                  target:
                    entity_id: light.led_strip
                hold_action: none
                double_tap_action: none
            - type: conditional
              conditions:
                - entity: light.led_strip
                  state: 'on'
              chip:
                type: action
                icon: mdi:auto-mode
                tap_action:
                  action: call-service
                  service: light.turn_on
                  data:
                    effect: Scene
                  target:
                    entity_id: light.led_strip
                hold_action: none
                double_tap_action: none
- type: conditional
  conditions:
    - entity: light.led_strip
      state: 'on'
  card:
    type: custom:mushroom-number-card
    entity: number.led_strip_strip_points
    display_mode: slider
- type: custom:state-switch
  entity: template
  template: |
    {% if is_state('light.led_strip', 'on') %}
      {% if is_state_attr('light.led_strip', 'effect', 'Music') %}
        Music
      {% elif is_state_attr('light.led_strip', 'effect', 'Scene') %}
        Scene
      {% elif is_state_attr('light.led_strip', 'effect', 'Dynamic') %}
        Dynamic
      {% endif %}
    {% endif %}
  states:
    Music:
      type: custom:mushroom-select-card
      entity: select.led_strip_music
    Scene:
      type: custom:mushroom-select-card
      entity: select.led_strip_scene
    Dynamic:
      type: custom:mushroom-select-card
      entity: select.led_strip_dynamic
