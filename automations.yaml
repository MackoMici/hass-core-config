- id: '1723450900531'
  alias: Klíma alvó üzemmódra kapcsolás
  description: ''
  trigger:
  - platform: time
    at: '22:00:00'
  condition:
  - condition: state
    entity_id: climate.gree_klima
    state: cool
  action:
  - action: climate.set_preset_mode
    data:
      preset_mode: sleep
    target:
      entity_id: climate.gree_klima
  mode: single
- id: '1726452970315'
  alias: Otthoni riasztás
  description: ''
  use_blueprint:
    path: MackoMici/home_security.yaml
    input:
      doorsensor: binary_sensor.sonoff_bejarati_ajto
      family_wifi: group.family_wifi
      family: group.family_all
      security: alarm_control_panel.gateway_alarm
      actions_on:
      - action: script.uzenet_kuldes_zolinak
        data:
          title: Riasztó
          message: Bekapcsolva
      actions_off:
      - action: script.uzenet_kuldes_zolinak
        metadata: {}
        data:
          title: Riasztó
          message: Kikapcsolva
      actions_alarm:
      - action: script.uzenet_kuldes_zolinak
        metadata: {}
        data:
          title: Riasztó
          message: Valaki bejutott a lakásba!
