- id: '1785178747065'
  alias: Alert2 értesítések éjszakai kikapcsolása
  description: Kikapcsolja a notification_control-t az alert2 entitásoknál 21:00 és
    06:00 között (kivéve alert2.alert2...)
  triggers:
  - at: '21:00:00'
    trigger: time
  actions:
  - action: alert2.notification_control
    data:
      enable: 'on'
      snooze_until: '{{ (now() + timedelta(hours=9)).strftime(''%Y-%m-%d %H:%M:%S%z'')
        }}'
      ack_at_snooze_start: false
    target:
      entity_id: "{{ states \n   | map(attribute='entity_id') \n   | select('search',
        '^alert2\\\\.') \n   | reject('search', '^alert2\\\\.alert2') \n   | list
        }}\n"
